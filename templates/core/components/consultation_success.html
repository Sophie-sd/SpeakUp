<div class="message message--success" role="alert" data-success="consultation">
  <div class="message__text">{{ message }}</div>
  <button type="button" class="message__close" aria-label="Закрити">×</button>
</div>

<script>
  // HTMX event listeners для очищення форми та закриття повідомлення
  document.addEventListener('htmx:afterSwap', function(e) {
    if (e.detail.target.dataset.success === 'consultation') {
      // Знайти батьківський контейнер форми та очистити
      const formContainer = e.detail.target.closest('[class*="consultation"]');
      if (formContainer) {
        const form = formContainer.querySelector('form');
        if (form) {
          form.reset();
        }
      }
    }
  });
</script>
