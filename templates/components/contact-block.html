{% load static %}
{% load phone_filters %}
{# Переиспользуемый блок быстрого контакта для всех форм заявок #}
<div class="contact-block">
  <!-- Блок телефону з кнопками копіювання та виклику -->
  <div class="contact-block__phone-section">
    <p class="contact-block__phone-label">Телефон:</p>
    <div class="contact-block__phone-block" data-contact-block>
      <span class="contact-block__phone-text" data-contact-phone>
        {% if contact_info %}{{ contact_info.phone_uk }}{% else %}+38 (093) 170-78-67{% endif %}
      </span>
      <button type="button" class="contact-block__copy-btn" data-contact-copy aria-label="Копіювати номер телефону">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        <span class="contact-block__copy-text">Копіювати</span>
      </button>
      <a href="tel:{{ contact_info.phone_uk|phone_for_tel if contact_info else '+380931707867' }}" class="contact-block__call-btn" aria-label="Позвонити">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span class="contact-block__call-text">Викликати</span>
      </a>
    </div>
  </div>

  <!-- Блок месенджерів -->
  <div class="contact-block__social-section">
    <h4 class="contact-block__social-title">Зв'яжіться в месенджерах:</h4>
    <div class="contact-block__social-buttons">
      <a href="https://t.me/+380930539963" class="contact-block__social-btn contact-block__social-btn--telegram" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.174 1.857-.927 6.654-1.309 8.838-.164.949-.488 1.265-.802 1.297-.696.068-1.225-.461-1.901-.903-1.056-.703-1.653-1.14-2.678-1.826-1.188-.78-.418-1.21.259-1.912.178-.184 3.247-2.977 3.307-3.23.007-.031.014-.147-.055-.208-.068-.061-.169-.038-.243-.022-.104.023-1.755 1.12-4.958 3.288-.47.312-.895.464-1.278.457-.42-.008-1.226-.237-1.826-.432-.737-.238-1.322-.365-1.27-.771.023-.18.345-.365.95-.554 3.69-1.458 6.15-2.42 7.38-2.884 3.55-1.365 4.28-1.603 4.76-1.606.107 0 .347.026.502.16.123.106.157.25.173.35.016.1.036.33.02.455z"/>

        <span>Telegram</span>

      <a href="https://www.instagram.com/speakup.ua/" class="contact-block__social-btn contact-block__social-btn--instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>

      <a href="https://www.facebook.com/SpeakUpSchool" class="contact-block__social-btn contact-block__social-btn--facebook" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        <span>Facebook</span>
      </a>
    </div>
  </div>
</div>
